services:
  backend:
    build:
      context: ./back
    container_name: ai_detector_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - /root/ai-detector/models:/app/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./front
    container_name: ai_detector_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"